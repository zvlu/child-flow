name: CI

on:
  push:
    branches: [main, feature/**]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4 # version is read from package.json "packageManager"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Surface high/critical dependency advisories (informational for now).
      - name: Dependency audit
        run: pnpm audit --audit-level high
        continue-on-error: true

      # Type-checking is clean and now blocking — a type error fails the build.
      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
