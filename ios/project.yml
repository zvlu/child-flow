name: Sprout
options:
  bundleIdPrefix: org.sprout
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Use the AccentColor colorset from each target's asset catalog so
    # .accentColor / default tint is brand sage instead of system blue.
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

# Shared sources used by both targets
# (Sources/Models and Sources/Networking are included in both targets below)

targets:

  # ─────────────────────────────────────────────
  # STAFF APP
  # ─────────────────────────────────────────────
  Sprout:
    type: application
    platform: iOS
    sources:
      - Sources
      # One app, every role: the family (parent) experience is compiled in
      # and reached from the same login screen. Exclude the family app's
      # own @main entry point.
      - path: FamilySources
        excludes:
          - "App/SproutFamilyApp.swift"
    resources:
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sprout.app
        INFOPLIST_FILE: Resources/Info.plist
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        PRODUCT_NAME: Sprout
    scheme:
      testTargets:
        - SproutTests

  # ─────────────────────────────────────────────
  # FAMILY APP
  # ─────────────────────────────────────────────
  SproutFamily:
    type: application
    platform: iOS
    sources:
      # Shared: models + networking from the staff project
      - path: Sources/Models
        name: Models
      - path: Sources/Networking
        name: Networking
      # Shared design tokens (programmatic colors/fonts; no asset-catalog deps)
      - path: Sources/App/DesignSystem.swift
        name: DesignSystem
      # Family-only views
      - FamilySources
    resources:
      - FamilyResources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sprout.family
        INFOPLIST_FILE: FamilyResources/Info.plist
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        PRODUCT_NAME: Sprout

  # ─────────────────────────────────────────────
  # TESTS
  # ─────────────────────────────────────────────
  SproutTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.sprout.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Sprout.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Sprout"
    dependencies:
      - target: Sprout
